name: FreeForYoung SG Ultra V3

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: freeforyoung-sg-ultra-v3
  cancel-in-progress: true

jobs:
  build:
    name: Build Singapore VPN Pool
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install requirements
        run: |
          python -m pip install --upgrade pip


      - name: Install Xray Core
        shell: bash
        run: |
          set -e

          sudo apt-get update -y
          sudo apt-get install -y curl unzip

          XRAY_VERSION="1.8.24"

          curl -L \
          "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" \
          -o /tmp/xray.zip

          mkdir -p /tmp/xray

          unzip -o /tmp/xray.zip \
          -d /tmp/xray

          chmod +x /tmp/xray/xray

          /tmp/xray/xray version

          echo "XRAY_PATH=/tmp/xray/xray" >> $GITHUB_ENV


      - name: Build Singapore servers
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Building SG Ultra V3"
          echo "================================"

          python scripts/build_v3.py


      - name: Validate output
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Checking output"
          echo "================================"

          test -f output/singapore.txt
          test -f output/singapore-top10.txt
          test -f output/singapore-base64.txt
          test -f output/singapore-stats.json

          echo "Files OK"

          echo
          echo "Statistics:"
          cat output/singapore-stats.json


      - name: Commit results
        shell: bash
        run: |
          set -e

          git config user.name "FreeForYoung Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update Singapore Ultra V3 servers"

          git push
